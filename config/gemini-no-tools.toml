# Loaded with `gemini --policy <this file>` by lib/omarchy_voice_agent.py.
#
# omarchy-voice asks the agent one question and wants one answer: it grants
# no tools. Gemini's --approval-mode plan would do, but Gemini overrides that
# mode in a folder it does not trust, and the agent is run from an empty
# runtime directory on purpose. A user-tier policy rule is not overridden.
[[rule]]
toolName = "*"
decision = "deny"
priority = 999
denyMessage = "omarchy-voice asks one question and grants no tools."
